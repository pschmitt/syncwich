<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <title>Syncwich icon</title>
  <circle cx="54" cy="54" r="54" fill="#e4572e"/>
  <g transform="translate(18,18)">
    <ellipse cx="36" cy="60" rx="21" ry="3" fill="#000000" opacity="0.18"/>

    <!-- bottom toast, tilted slightly -->
    <g transform="rotate(-2 36 51)">
      <rect x="12" y="44" width="48" height="14" rx="6" fill="#fcefdc" stroke="#4a2413" stroke-width="2.2" stroke-linejoin="round"/>
      <rect x="12" y="53" width="48" height="5" rx="2.5" fill="#8b4a2b" opacity="0.28"/>
    </g>

    <!-- lettuce ruffle, bulging past the crust -->
    <path d="M7,39 Q13,31 19,39 Q25,31 31,39 Q37,31 43,39 Q49,31 55,39 Q61,31 66,39 L66,45 L7,45 Z"
          fill="#6e9c4c" stroke="#4a2413" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- melty cheese, a small tab drooping past the right edge -->
    <polygon points="12,33 59,32 64,40 58,42 12,40" fill="#e4a83a" stroke="#4a2413" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- tomato slices, poking past the left edge, scattered not stacked -->
    <circle cx="6" cy="36" r="4.4" fill="#a83226" stroke="#4a2413" stroke-width="2.2"/>
    <circle cx="10" cy="44.5" r="3.8" fill="#a83226" stroke="#4a2413" stroke-width="2.2"/>
    <ellipse cx="4.8" cy="34.3" rx="0.9" ry="0.55" fill="#fcefdc" opacity="0.85"/>
    <ellipse cx="7.6" cy="37.4" rx="0.9" ry="0.55" fill="#fcefdc" opacity="0.85"/>
    <ellipse cx="9" cy="43" rx="0.85" ry="0.5" fill="#fcefdc" opacity="0.85"/>

    <!-- top toast, leaning jauntily -->
    <g transform="rotate(4 36 24)">
      <rect x="10" y="17" width="52" height="14" rx="6" fill="#fcefdc" stroke="#4a2413" stroke-width="2.4" stroke-linejoin="round"/>
      <rect x="10" y="17" width="52" height="5" rx="2.5" fill="#8b4a2b" opacity="0.22"/>
      <circle cx="18" cy="27" r="1.3" fill="#8b4a2b" opacity="0.45"/>
      <circle cx="49" cy="26" r="1.3" fill="#8b4a2b" opacity="0.45"/>
      <circle cx="40" cy="20.5" r="1.3" fill="#8b4a2b" opacity="0.45"/>
      <ellipse cx="23" cy="21.5" rx="10" ry="3" fill="#ffffff" opacity="0.35" transform="rotate(-16 23 21.5)"/>
    </g>
  </g>
</svg>
