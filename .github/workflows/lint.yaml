name: Lint

# Dispatchable on demand (e.g. to preemptively check formatting before pushing) in addition to
# its normal push/PR gating. Delegates to pschmitt/android-app-ci's reusable lint workflow (ktfmt
# + Android Lint) - see that repo's README for what it does. enable-auto-fix is off: a formatting
# fix here is applied by a maintainer or coding agent on the intended branch, this workflow does
# not create pull requests automatically. Syncwich has no app/lint-baseline.xml, so that check is
# skipped too.
on:
  push:
    branches:
      - main
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/lint.yaml'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

jobs:
  lint:
    uses: pschmitt/android-app-ci/.github/workflows/lint.yaml@main
    with:
      lint-baseline-path: ''
      enable-auto-fix: false
    secrets: inherit
    permissions:
      contents: read
