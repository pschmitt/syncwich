name: Play Store Release

# Stable semantic-version tags publish a signed bundle to internal testing. The first run requires
# one-time Play Console setup (app created, service account granted access) and the
# CI_KEYSTORE_BASE64/CI_KEYSTORE_PASSWORD/CI_KEY_ALIAS/CI_KEY_PASSWORD/PLAY_SERVICE_ACCOUNT_JSON
# repo secrets - none of that exists yet for this app, so this workflow stays dormant (fails the
# credential check below) until it's configured.
on:
  push:
    tags:
      - v*
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version_code:
        description: "Positive, monotonically increasing Google Play version code"
        required: true
        default: "1000000"
        type: string
      version_name:
        description: "User-visible release version"
        required: true
        default: "1.0.0"
        type: string

concurrency:
  group: play-store-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish internal-testing bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version_code="$INPUT_VERSION_CODE"
            version_name="$INPUT_VERSION_NAME"
          elif [[ "$REF_NAME" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            version_code=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
          else
            echo "Expected a semantic-version tag such as 1.0.0" >&2
            exit 1
          fi
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer" >&2
            exit 1
          }
          (( version_code <= 2100000000 )) || {
            echo "version_code exceeds Google Play's maximum" >&2
            exit 1
          }
          [[ "$version_name" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]] || {
            echo "version_name contains unsupported characters" >&2
            exit 1
          }
          {
            echo "code=$version_code"
            echo "name=$version_name"
          } >> "$GITHUB_OUTPUT"

      - name: Check publishing credentials
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          for name in CI_KEYSTORE_BASE64 CI_KEYSTORE_PASSWORD CI_KEY_ALIAS CI_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            [[ -n "${!name}" ]] || {
              echo "$name is required for Play publishing" >&2
              exit 1
            }
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode CI signing keystore
        id: ci_keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'syncwich-ci.jks'
          encodedString: ${{ secrets.CI_KEYSTORE_BASE64 }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed Android App Bundle
        env:
          CI_KEYSTORE_PATH: ${{ steps.ci_keystore.outputs.filePath }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
        run: >
          ./gradlew bundleRelease
          -PversionCode=${{ steps.version.outputs.code }}
          -PversionName=${{ steps.version.outputs.name }}
          --stacktrace --build-cache

      - name: Verify bundle output
        run: test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: syncwich-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.pschmitt.syncwich
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
