name: Play Store Release

# Stable semantic-version tags publish a signed bundle to both the internal and closed (alpha)
# testing tracks in one upload - closed testing is the highest track this app is currently
# eligible for, so every tagged release goes out to both simultaneously rather than needing a
# separate promotion step. Delegates the actual build/publish to pschmitt/android-app-ci's
# reusable play-store.yaml, which additionally requires the repository variable
# PLAY_PUBLISH_ENABLED=true (set that only after Play Console and service-account setup) - a tag
# push safely fails loudly instead of silently publishing on a fresh checkout, unlike this
# workflow's previous unconditional-on-any-tag design.
#
# Version resolution stays local: Syncwich's build.gradle.kts has no baked-in incrementing default
# (versionCode/versionName fall back to fixed values unless overridden), so a real value has to be
# computed and passed on every run rather than leaving it to the shared workflow's own "use the
# app's default" behavior.

on:
  push:
    tags:
      - v*
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version_code:
        description: "Override versionCode (leave blank on a tag build to derive it from the tag)"
        required: false
        type: string
      version_name:
        description: "Override versionName (leave blank on a tag build to derive it from the tag)"
        required: false
        type: string
      publish:
        description: "Upload the bundle to the Play internal + closed (alpha) testing tracks"
        required: true
        default: false
        type: boolean

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.resolve.outputs.code }}
      name: ${{ steps.resolve.outputs.name }}
    steps:
      - name: Resolve release version
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          if [[ -n "$INPUT_VERSION_CODE" || -n "$INPUT_VERSION_NAME" ]]; then
            version_code="$INPUT_VERSION_CODE"
            version_name="$INPUT_VERSION_NAME"
          elif [[ "$REF_NAME" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            # Keep version codes deterministic and monotonic for semantic-version tags.
            version_code=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
          else
            echo "Expected a semantic-version tag such as 1.0.0, or explicit version_code/version_name inputs" >&2
            exit 1
          fi
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer" >&2
            exit 1
          }
          (( version_code <= 2100000000 )) || {
            echo "version_code exceeds Google Play's maximum" >&2
            exit 1
          }
          [[ "$version_name" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]] || {
            echo "version_name contains unsupported characters" >&2
            exit 1
          }
          {
            echo "code=$version_code"
            echo "name=$version_name"
          } >> "$GITHUB_OUTPUT"

  play-store:
    needs: version
    uses: pschmitt/android-app-ci/.github/workflows/play-store.yaml@main
    with:
      application-id: dev.pschmitt.syncwich
      artifact-label: syncwich
      version-code: ${{ needs.version.outputs.code }}
      version-name: ${{ needs.version.outputs.name }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      # Publish to both tracks in one upload - closed (alpha) is the highest track this app is
      # currently eligible for, and there's no reason internal testers should lag behind it.
      track: internal,alpha
    secrets: inherit
