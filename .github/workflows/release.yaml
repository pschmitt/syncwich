name: Release

# One pipeline, two release flavors depending on what got pushed:
# - a push to main moves the rolling "latest" prerelease tag and republishes it
# - a push of a semantic-version tag ("vX.Y.Z" or "X.Y.Z") publishes a real, permanent release
# Delegates to pschmitt/android-app-ci's reusable release workflow - see that repo's README.
#
# CI_KEYSTORE_BASE64/CI_KEYSTORE_PASSWORD/CI_KEY_ALIAS/CI_KEY_PASSWORD must exist as repo secrets
# before this can produce a real signed release - see justfile's `build variant=release` comment
# and the rbw entry "Syncwich CI Signing Keystore" for the matching local-build keystore.

on:
  push:
    branches:
      - main
    tags:
      - v*
      - '*.*.*'
  workflow_dispatch:

jobs:
  release:
    uses: pschmitt/android-app-ci/.github/workflows/release.yaml@main
    with:
      app-display-name: Syncwich
      application-id: dev.pschmitt.syncwich
      artifact-label: syncwich
      compute-version-name: true
      # syncwich's screenshots.yaml isn't tag-triggered from release.yaml (unlike the sibling
      # apps) - matches its pre-migration behavior.
      trigger-screenshots: false
    secrets: inherit
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
