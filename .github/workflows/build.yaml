name: Build

on:
  push:
  pull_request:

jobs:
  assemble:
    name: Assemble
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21.0.11'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Compute build metadata
        id: metadata
        run: |
          revision="$(git describe --always --abbrev=12 --dirty --exclude=latest)"
          if [[ "$revision" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)([-+].*)?$ ]]; then
            version_name="${BASH_REMATCH[1]}"
          else
            version_name="0.1.0"
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
      - name: Build with Gradle
        run: ./gradlew assembleDebug -PversionName=${{ steps.metadata.outputs.version_name }}
        env:
          GIT_REVISION: ${{ steps.metadata.outputs.revision }}
      - name: Upload artifact app-arm64-v8a-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: app-arm64-v8a-debug.apk
          path: ./app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - name: Upload artifact app-armeabi-v7a-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: app-armeabi-v7a-debug.apk
          path: ./app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
      - name: Upload artifact app-x86_64-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: app-x86_64-debug.apk
          path: ./app/build/outputs/apk/debug/app-x86_64-debug.apk
      - name: Upload artifact app-x86-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: app-x86-debug.apk
          path: ./app/build/outputs/apk/debug/app-x86-debug.apk
      - name: Verify embedded Android version name
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version_name }}
        run: |
          aapt2_path="$(ls -1d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)"
          apk="app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          actual_version="$($aapt2_path dump badging "$apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "expected Android version $EXPECTED_VERSION, got $actual_version" >&2
            exit 1
          fi
