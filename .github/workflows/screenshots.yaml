name: Screenshots

# Screenshot capture is intentionally manual. It drives the app via fastlane screengrab (see
# fastlane/Screengrabfile and app/src/androidTest/kotlin/.../ScreenshotTest.kt) on disposable
# GitHub-hosted emulators, then uploads the reviewed images as a build artifact (or, with
# open_pr, opens/updates a PR with them committed - see pschmitt/android-app-ci's
# screenshots-open-pr.yaml reusable workflow).
on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open a PR with the captured screenshots committed, instead of only uploading a build artifact
        type: boolean
        default: false

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phone
            profile: pixel_2
            folder: phoneScreenshots
          - device_type: sevenInch
            profile: Nexus 7
            folder: sevenInchScreenshots
          - device_type: tenInch
            profile: medium_tablet
            folder: tenInchScreenshots
    name: Capture ${{ matrix.device_type }} screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      E2E_BASE_URL: http://127.0.0.1:9925
      E2E_USERNAME: syncwich-ci@example.invalid
      E2E_PASSWORD: syncwich-ci-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pschmitt/android-app-ci/.github/actions/setup-jdk-gradle@main

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Cache Mealie Docker image
        uses: actions/cache@v4
        with:
          path: /tmp/syncwich-mealie-v3.22.0.tar.gz
          key: syncwich-mealie-v3.22.0-${{ runner.os }}-v1

      - name: Load or pull Mealie Docker image
        run: |
          image="ghcr.io/mealie-recipes/mealie:v3.22.0"
          archive=/tmp/syncwich-mealie-v3.22.0.tar.gz
          if [ -s "$archive" ]; then
            gzip -dc "$archive" | docker load
          else
            docker pull "$image"
            docker save "$image" | gzip -1 > "$archive"
          fi

      - name: Start disposable Mealie fixture
        run: docker compose -f ci/mealie/docker-compose.yml up --no-build --detach --wait --wait-timeout 600

      - name: Seed deterministic screenshot recipes
        run: |
          python3 ci/mealie/seed_screenshots.py \
            --base-url "$E2E_BASE_URL" \
            --username "$E2E_USERNAME" \
            --password "$E2E_PASSWORD" \
            --github-env "$GITHUB_ENV"

      # Build before the emulator starts, not while it's running: screengrab only installs/drives
      # prebuilt APKs over adb, and compiling concurrently with a booted emulator starves it of
      # CPU until it drops off adb entirely.
      - name: Build the debug and androidTest APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          mkdir -p dist
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/*-arm64-v8a-debug.apk)
          test_apks=(app/build/outputs/apk/androidTest/debug/*-androidTest.apk)
          if [[ ${#debug_apks[@]} -ne 1 || ${#test_apks[@]} -ne 1 ]]
          then
            printf 'Expected one arm64 debug APK and one androidTest APK, found %d and %d\n' \
              "${#debug_apks[@]}" "${#test_apks[@]}" >&2
            exit 1
          fi
          cp "${debug_apks[0]}" dist/app-debug.apk
          cp "${test_apks[0]}" dist/app-debug-androidTest.apk

      - uses: pschmitt/android-app-ci/.github/actions/enable-kvm@main

      - name: Capture screenshots in a ${{ matrix.device_type }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: ${{ matrix.profile }}
          target: google_apis
          force-avd-creation: true
          emulator-boot-timeout: 1800
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          # android-emulator-runner runs each line of this script as its own separate `sh -c`
          # process, so a shell variable set on one line is gone by the next - the serial capture,
          # install, and the fastlane invocation that needs the serial must all stay on one line.
          # `install -g` grants every runtime permission declared in the manifest at install time.
          # Retries the reinstall+capture (not the whole job) up to twice - cheap versus the full
          # rebuild+reboot, and each attempt starts from a clean reinstall.
          script: |
            attempt=0; until [ "$attempt" -ge 2 ]; do attempt=$((attempt + 1)); serial="$(adb devices | awk '$2 == "device" { print $1; exit }')"; if [ -n "$serial" ] && adb -s "$serial" reverse tcp:9925 tcp:9925 && adb -s "$serial" install -r -g -t dist/app-debug.apk && SCREENGRAB_DEVICE_TYPE=${{ matrix.device_type }} SCREENGRAB_SPECIFIC_DEVICE="$serial" fastlane screenshots; then exit 0; fi; echo "Attempt $attempt/2 failed" >&2; sleep 5; done; exit 1

      - name: Upload screenshot artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: syncwich-${{ matrix.device_type }}-screenshots-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            fastlane/metadata/android/en-US/images/${{ matrix.folder }}/
            app/build/reports/androidTests/

      - name: Capture Mealie fixture diagnostics
        if: ${{ failure() }}
        run: docker compose -f ci/mealie/docker-compose.yml logs --no-color > screenshot-mealie.log || true

      - name: Upload Mealie fixture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: syncwich-${{ matrix.device_type }}-screenshot-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: screenshot-mealie.log

      - name: Tear down disposable Mealie fixture
        if: ${{ always() }}
        run: docker compose -f ci/mealie/docker-compose.yml down --volumes --remove-orphans

  open-pr:
    needs: capture
    if: ${{ !cancelled() && !failure() && inputs.open_pr }}
    uses: pschmitt/android-app-ci/.github/workflows/screenshots-open-pr.yaml@main
    with:
      artifact-label: syncwich
      commit-message: "chore: update Play Store screenshots (phone, 7in, 10in tablet)"
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write

